[build-system]
requires = ["setuptools>=80", "wheel", "setuptools-rust>=1.10"]
build-backend = "setuptools.build_meta"

[project]
name = "linprogx"
version = "0.1.0"
description = "A small linear programming solver with a simplex core and optional C acceleration."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Evan Oman" }]
keywords = ["linear-programming", "optimization", "simplex", "operations-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "clarabel>=0.11.1",
    "genbadge[coverage]>=1.1.3",
    "matplotlib>=3.10.0",
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
    "scipy>=1.14.0",
    "ty>=0.0.8",
]

[project.scripts]
linprogx = "linprogx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[[tool.setuptools.ext-modules]]
name = "linprogx._cfast"
sources = ["src/linprogx/_cfast.c"]

[[tool.setuptools.ext-modules]]
name = "linprogx._csparse"
sources = ["src/linprogx/_csparse.c"]

[[tool.setuptools-rust.ext-modules]]
target = "linprogx._rsparse"
path = "rust/Cargo.toml"
binding = "PyO3"
features = ["pyo3/extension-module"]
debug = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["linprogx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
