[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linprogx"
version = "0.1.0"
description = "A dependency-free linear programming solver: two-phase simplex, sparse interior-point and PDHG solvers, with C extensions for performance."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Evan Oman" }]
keywords = ["linear-programming", "optimization", "simplex", "operations-research", "interior-point", "sparse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/EvanOman/linprogx"
Repository = "https://github.com/EvanOman/linprogx"
Issues = "https://github.com/EvanOman/linprogx/issues"

[project.optional-dependencies]
dev = [
    "bandit>=1.8.0",
    "clarabel>=0.11.1",
    "fastapi==0.139.0",
    "genbadge[coverage]>=1.1.3",
    "httpx>=0.28.1",
    "idna>=3.15",
    "matplotlib>=3.10.0",
    "msgpack>=1.2.1",
    "pip-audit>=2.9.0",
    "pytest>=9.0.0",
    "pydantic==2.13.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
    "scipy>=1.14.0",
    "starlette==1.3.1",
    "ty>=0.0.8",
]

[project.scripts]
linprogx = "linprogx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linprogx = ["py.typed"]

[[tool.setuptools.ext-modules]]
name = "linprogx._cfast"
sources = ["src/linprogx/_cfast.c"]
extra-compile-args = ["-O3"]

[[tool.setuptools.ext-modules]]
name = "linprogx._csparse"
sources = ["src/linprogx/_csparse.c"]
extra-compile-args = ["-O3", "-pthread", "-DLINPROGX_HAVE_BLAS"]
extra-link-args = ["-pthread"]
libraries = ["openblas"]

[tool.cibuildwheel]
build = "cp312-manylinux_x86_64 cp313-manylinux_x86_64"
before-all = "yum install -y openblas-devel || (apt-get update && apt-get install -y libopenblas-dev)"
test-command = 'python -c "from linprogx import solve; r = solve(c=[3,2], A=[[1,1],[1,0],[0,1]], b=[4,2,3], objective=\"max\"); assert abs(r.objective_value - 10.0) < 1e-6"'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["linprogx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["tools/modal_bench.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# The solver itself is installed into the environment; `demo/` is not a package
# and is only ever run from a checkout (Render, Modal), so tests reach it through
# the repository root.
pythonpath = ["."]

[tool.coverage.report]
fail_under = 85
show_missing = true
