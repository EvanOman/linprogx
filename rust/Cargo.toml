[package]
name = "linprogx_rsparse"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_rsparse"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"

[profile.release.package."*"]
opt-level = 3
